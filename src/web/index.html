<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantDesk · 币安TradFi量化工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">⚡ QuantDesk <span class="sub">币安 TradFi 量化工作台</span></div>
  <div class="header-right">
    <span id="clock"></span>
    <span id="engine-state" class="badge">连接中…</span>
    <button id="btn-paper" title="AI 自动模拟盘">📈 模拟盘</button>
    <button id="btn-notify" title="开启浏览器通知">🔔 通知</button>
    <button id="btn-sound" class="on" title="提示音开关">🔊 音效</button>
  </div>
</header>

<div class="layout">
  <!-- 左：合约网格 -->
  <section class="panel grid-panel">
    <div class="panel-title">
      <span>📊 合约监控 <em id="sym-count"></em></span>
      <div class="filters">
        <input id="search" placeholder="搜索…">
        <select id="filter">
          <option value="all">全部</option>
          <option value="mine">持仓+自选</option>
          <option value="long">偏多 ≥60</option>
          <option value="short">偏空 ≤-60</option>
        </select>
        <select id="sort">
          <option value="score">按|评分|</option>
          <option value="pct">按涨跌幅</option>
          <option value="alpha">按代码</option>
        </select>
      </div>
    </div>
    <div id="breadth" class="breadth">市场结论计算中…</div>
    <div id="grid" class="grid"></div>
  </section>

  <!-- 右：信号 + 舆情 -->
  <aside class="side">
    <section class="panel">
      <div class="panel-title"><span>🚨 信号提醒</span><button id="btn-clear-alerts">全部已读</button></div>
      <div id="alerts" class="alerts"></div>
    </section>
    <section class="panel grow">
      <div class="panel-title"><span>📰 舆情流 <em id="news-count"></em></span></div>
      <div id="news" class="news"></div>
    </section>
  </aside>
</div>

<!-- 模拟盘全屏页 -->
<div id="paper-page" class="paper-page hidden">
  <div class="paper-head">
    <b>📈 AI 自动模拟盘</b>
    <span class="dim">10,000 USDT 起步 · 10x 杠杆 · 信号自动开平仓</span>
    <span id="paper-rules" class="dim paper-rules"></span>
    <button id="paper-reset" title="清空并回到 10,000 USDT">🔄 重置账户</button>
    <button id="paper-close">✕ 返回</button>
  </div>
  <div id="paper-cards" class="paper-cards"></div>
  <section class="panel">
    <div class="panel-title"><span>💹 账户权益曲线</span><span id="paper-mdd" class="dim"></span></div>
    <canvas id="paper-chart" width="1200" height="260"></canvas>
  </section>
  <div class="paper-cols">
    <section class="panel">
      <div class="panel-title"><span>📦 当前持仓 <em id="paper-pos-count"></em></span></div>
      <div id="paper-positions" class="paper-table"></div>
    </section>
    <section class="panel">
      <div class="panel-title"><span>📜 历史成交 <em id="paper-trade-count"></em></span></div>
      <div id="paper-trades" class="paper-table"></div>
    </section>
  </div>
  <div class="disclaimer" id="paper-disclaimer"></div>
</div>

<!-- 详情弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <b id="m-symbol"></b>
        <span id="m-price"></span>
        <span id="m-pct"></span>
        <span id="m-position"></span>
        <button id="m-watch" title="自选开关">☆</button>
      </div>
      <div>
        <div class="tf-switch">
          <button data-tf="15m">15m</button>
          <button data-tf="1h" class="on">1h</button>
          <button data-tf="4h">4h</button>
        </div>
        <button id="m-close">✕</button>
      </div>
    </div>
    <canvas id="chart" width="960" height="380"></canvas>
    <div id="m-score-summary" class="score-summary"></div>
    <div id="m-report" class="report"></div>
    <div class="factors-title">📐 因子明细（当前周期）</div>
    <div id="m-factors" class="factors"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

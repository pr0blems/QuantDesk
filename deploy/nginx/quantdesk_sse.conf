# Install this file inside the site's nginx extension directory.  The exact
# location takes precedence over the generic application proxy and keeps the
# authenticated AI monitor event stream unbuffered end to end.
location = /api/v2/ai-monitor/events {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header X-Accel-Buffering "no" always;
}

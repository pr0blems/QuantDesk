name: Release quality gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  production-readiness:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify release documentation and deployment inputs
        env:
          DEPLOYMENT_TARGET: ${{ vars.DEPLOYMENT_TARGET }}
          METRICS_TOKEN_CONFIGURED: ${{ vars.METRICS_TOKEN_CONFIGURED }}
        run: |
          test -s docs/external-api-v1.md
          test -n "$DEPLOYMENT_TARGET"
          test "$METRICS_TOKEN_CONFIGURED" = "true"
      - name: Deliberately stop before deployment
        run: |
          echo "Quality gate passed. Deployment remains an explicit protected-environment action."

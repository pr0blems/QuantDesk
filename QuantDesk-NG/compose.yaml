name: quantdesk-ng

x-runtime-env: &runtime-env
  APP_HOST: 0.0.0.0
  APP_PORT: 8200
  DB_HOST: mysql
  DB_SSL_REQUIRED: "false"
  DB_SSL_VERIFY_IDENTITY: "false"
  QUANTDESK_CONFIG_DIR: /app/config

x-app: &app
  build: .
  env_file: .env
  environment: *runtime-env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 30s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-quantdesk}
      MYSQL_USER: ${DB_USER:-quantdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # The application never uses MySQL root. Let the image generate its
      # one-time root password so a local .env only needs DB_PASSWORD.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    env_file: .env
    environment: *runtime-env
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8200:8200"
    command: ["quantdesk-ng", "serve"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/api/v2/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3

  worker-market:
    <<: *app
    healthcheck:
      test: ["CMD", "quantdesk-ng", "worker-health", "--role", "market"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    command: ["quantdesk-ng", "worker", "--role", "market"]

  worker-news:
    <<: *app
    healthcheck:
      test: ["CMD", "quantdesk-ng", "worker-health", "--role", "news"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    command: ["quantdesk-ng", "worker", "--role", "news"]

  worker-paper:
    <<: *app
    healthcheck:
      test: ["CMD", "quantdesk-ng", "worker-health", "--role", "paper"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    command: ["quantdesk-ng", "worker", "--role", "paper"]

  worker-intelligence:
    <<: *app
    healthcheck:
      test: ["CMD", "quantdesk-ng", "worker-health", "--role", "intelligence"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    command: ["quantdesk-ng", "worker", "--role", "intelligence"]

volumes:
  mysql-data:

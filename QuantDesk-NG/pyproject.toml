[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk-ng"
version = "0.2.0"
description = "Multi-user Binance TradFi quantitative research and controlled execution platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=50,<51",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "joblib>=1.4,<2",
  "lightgbm>=4.6,<5",
  "numpy>=2,<3",
  "pandas>=3,<4",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "PyMySQL>=1.1,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0.40,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]
research = [
  "joblib>=1.4,<2",
  "lightgbm>=4.6,<5",
  "numpy>=2,<3",
  "pandas>=3,<4",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
quantdesk-v2 = "quantdesk_v2.cli:main"
quantdesk-ng = "quantdesk_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantdesk_v2*", "quantdesk*"]

[tool.setuptools.package-data]
quantdesk_v2 = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/quantdesk_v2/api.py" = ["B008"]
"src/quantdesk_v2/admin.py" = ["B008"]
"src/quantdesk_v2/proxy_routes.py" = ["B008"]
"src/quantdesk_v2/dependencies.py" = ["B008"]
"src/quantdesk_v2/strategy_routes.py" = ["B008"]
"src/quantdesk_v2/saas.py" = ["B008"]
"src/quantdesk_v2/schemas.py" = ["S105"]
"tests/*" = ["S101", "S105"]

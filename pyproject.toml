[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk-v2"
version = "0.1.0"
description = "Multi-user Binance Stocks quantitative trading platform foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<50",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "PyMySQL>=1.1,<3",
  "SQLAlchemy>=2.0.40,<3",
  "tigeropen>=3.7,<4",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
quantdesk-v2 = "quantdesk_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantdesk_v2*"]

[tool.setuptools.package-data]
quantdesk_v2 = ["static/*", "react_static/*", "react_static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/quantdesk_v2/api.py" = ["B008"]
"src/quantdesk_v2/admin.py" = ["B008"]
"src/quantdesk_v2/dependencies.py" = ["B008"]
"src/quantdesk_v2/strategy_routes.py" = ["B008"]
"src/quantdesk_v2/schemas.py" = ["S105"]
"tests/*" = ["S101", "S105"]

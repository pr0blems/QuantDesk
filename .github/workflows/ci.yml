name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Build production image
        working-directory: .
        run: docker build --target runtime --tag quantdesk-ci .
      - name: Verify packaged React canary assets
        working-directory: .
        run: >-
          docker run --rm --entrypoint python quantdesk-ci -c
          "from pathlib import Path; import quantdesk_v2;
          root=Path(quantdesk_v2.__file__).parent/'react_static';
          assert (root/'index.html').is_file();
          assert any((root/'assets').glob('*.js'))"

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      QUANTDESK_TEST_DATABASE_ADMIN_URL: mysql+pymysql://root:root-test-password@127.0.0.1:3306/mysql
      DB_SSL_REQUIRED: "false"
      DB_SSL_VERIFY_IDENTITY: "false"
      APP_ENV: test
      APP_COOKIE_SECURE: "false"
      JWT_SECRET: quantdesk-ci-jwt-secret-that-is-long-enough
      CREDENTIAL_MASTER_KEY: cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/export_openapi.py --check web/openapi.json
      - run: ruff check src tests scripts/export_openapi.py
      - run: pytest
